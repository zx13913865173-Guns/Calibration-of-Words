# =============================================================================
# Weight syntax definitions and native weight-level mapping.
# Source: paper Section 2.2 ("Weight Syntax Definitions and Software Implementation").
#
# `factor`  : the effective multiplier applied to the target token embedding.
# `string`  : the literal prompt fragment written by a human, with `{w}` as the
#             placeholder for the target word. Rules are:
#               SD-native : ( ) x1.1 per layer ; [ ] x0.9 per layer
#               ComfyUI   : (word:n) numeric weight n
#               NovelAI   : { } x1.05 per layer ; [ ] x0.95 per layer
# =============================================================================

levels:
  W1: { ordinal: 1, name: "strong suppression" }
  W2: { ordinal: 2, name: "suppression" }
  W3: { ordinal: 3, name: "standard" }
  W4: { ordinal: 4, name: "emphasis" }
  W5: { ordinal: 5, name: "strong emphasis" }

# Native (as-shipped) numerical mapping used for the main experiment.
native:
  sd_native:            # Automatic1111 WebUI v1.6.0
    W1: { factor: 0.81, string: "[[@W@]]" }      # 0.9^2
    W2: { factor: 0.90, string: "[@W@]" }        # 0.9
    W3: { factor: 1.10, string: "(@W@)" }        # 1.1
    W4: { factor: 1.21, string: "((@W@))" }      # 1.1^2
    W5: { factor: 1.33, string: "(((@W@)))" }    # 1.1^3
  comfyui:              # ComfyUI v0.2.2
    W1: { factor: 0.2,  string: "(@W@:0.2)" }
    W2: { factor: 0.5,  string: "(@W@:0.5)" }
    W3: { factor: 1.0,  string: "(@W@:1.0)" }
    W4: { factor: 1.5,  string: "(@W@:1.5)" }
    W5: { factor: 2.0,  string: "(@W@:2.0)" }
  novelai:              # A1111 v1.6.0 + NovelAI extension v1.3
    W1: { factor: 0.9025, string: "[[@W@]]" }        # 0.95^2
    W2: { factor: 0.95,   string: "[@W@]" }          # 0.95
    W3: { factor: 1.05,   string: "{@W@}" }          # 1.05
    W4: { factor: 1.1025, string: "{{@W@}}" }        # 1.05^2
    W5: { factor: 1.157625, string: "{{{@W@}}}" }    # 1.05^3

# Perceptually calibrated ComfyUI anchors (paper Section 3.1, Fig. 2A).
# Native operation -> the ComfyUI numeric value that a 12-rater forced-choice
# procedure judged perceptually equivalent.
calibration_anchors:
  sd_native_W3: { native_factor: 1.10, comfyui_matched: 1.16, sd: 0.09, ci95: [1.10, 1.22] }
  sd_native_W4: { native_factor: 1.21, comfyui_matched: 1.34, sd: 0.12, ci95: [1.26, 1.42] }
  sd_native_W5: { native_factor: 1.33, comfyui_matched: 1.57, sd: 0.14, ci95: [1.48, 1.66] }
  novelai_W5:   { native_factor: 1.16, comfyui_matched: 1.22, sd: 0.11, ci95: [1.15, 1.29] }

# Four-level progressive ablation (paper Section 2.8).
ablation:
  L0: "SD-native full syntax (baseline)"
  L1: "keep brackets, replace with linear mapping (isolates mapping and range)"
  L2: "remove syntax wrapper, direct numeric weights (isolates syntax form)"
  L3: "fixed neutral template, only target word (controls semantic complexity)"
  L4: "blank baseline, no weight (confirmation)"
