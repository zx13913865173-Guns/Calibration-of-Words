# Conda environment matching the frozen software stack reported in the paper.
#   conda env create -f environment.yml
#   conda activate calibration-of-words
name: calibration-of-words
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch>=2.1
  - torchvision
  - pytorch-cuda=12.1        # drop this line for CPU-only analysis
  - pip
  - pip:
      - diffusers==0.25.0
      - transformers==4.36.0
      - accelerate>=0.24.0
      - safetensors>=0.4.0
      - sentencepiece>=0.1.99
      - ftfy>=6.1.1
      - huggingface_hub>=0.19.0
      - requests>=2.31.0
      - websocket-client>=1.6.0
      - Pillow>=10.0.0
      - numpy>=1.24
      - pandas>=2.0
      - scipy>=1.11
      - statsmodels>=0.14
      - matplotlib>=3.7
      - PyYAML>=6.0
      - tqdm>=4.66
